name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_CACHE: /tmp/electron-cache
  NODE_MIRROR: https://npmmirror.com/mirrors/node/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_name: AoiRouxTrainers-win
          - os: ubuntu-22.04
            target: linux
            artifact_name: AoiRouxTrainers-linux
          - os: macos-14
            target: mac
            artifact_name: AoiRouxTrainers-mac
          - os: ubuntu-22.04
            target: android
            artifact_name: AoiRouxTrainers-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        run: |
          NODE_VERSION=v20.18.0
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL https://npmmirror.com/mirrors/node/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1 ;;
            macOS)
              curl -fsSL https://npmmirror.com/mirrors/node/${NODE_VERSION}/node-${NODE_VERSION}-darwin-x64.tar.gz | tar -xz -C /usr/local --strip-components=1 ;;
            Windows)
              curl -fsSL https://npmmirror.com/mirrors/node/${NODE_VERSION}/node-${NODE_VERSION}-win-x64.zip -o node.zip
              unzip -q node.zip -C /c/nodejs
              echo "C:\tools\nodejs" >> $GITHUB_PATH ;;
          esac
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build Electron app
        if: matrix.target != 'android'
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload artifact
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
          retention-days: 30

      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          for dir in release/*/; do
            cp -r "$dir"* dist/ 2>/dev/null || true
          done
          echo "Files to upload:"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
