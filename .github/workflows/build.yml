name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_CACHE: /tmp/electron-cache
  NODE_MIRROR: https://npmmirror.com/mirrors/node/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_name: AoiRouxTrainers-win
          - os: ubuntu-22.04
            target: linux
            artifact_name: AoiRouxTrainers-linux
          - os: macos-14
            target: mac
            artifact_name: AoiRouxTrainers-mac
          - os: ubuntu-22.04
            target: android
            artifact_name: AoiRouxTrainers-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          CI: "false"

      - name: Build Electron app
        if: matrix.target != 'android'
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Setup Android SDK
        if: matrix.target == 'android'
        run: |
          SDK_URL=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p /opt/android-sdk/cmdline-tools
          curl -fsSL "$SDK_URL" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-tmp
          mv /tmp/cmdline-tools-tmp/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload artifact
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
          retention-days: 30

      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          for dir in release/*/; do
            cp -r "$dir"* dist/ 2>/dev/null || true
          done
          echo "Files to upload:"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
