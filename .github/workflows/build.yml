name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_CACHE: /tmp/electron-cache

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_name: AoiRouxTrainers-win
          - os: ubuntu-22.04
            target: linux
            artifact_name: AoiRouxTrainers-linux
          - os: macos-14
            target: mac
            artifact_name: AoiRouxTrainers-mac
          - os: ubuntu-22.04
            target: android
            artifact_name: AoiRouxTrainers-android
    runs-on: ${{ matrix.os }}
    # Skip if workflow_dispatch and platform doesn't match
    if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build Electron app
        if: matrix.target != 'android'
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload artifact
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/Aoi.Roux.Trainers-1.7.0-win.zip
            release/Aoi.Roux.Trainers-1.7.0.AppImage
            release/cmll-trainer-1.7.0.tar.gz
            release/Aoi.Roux.Trainers-1.7.0-arm64.dmg
          retention-days: 30

      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find release -type f \( -name "*.zip" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.apk" \) -exec cp {} dist/ \;
          echo "Files to upload:"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
