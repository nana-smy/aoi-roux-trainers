name: Tauri Build

# 与 build.yml（Electron + Capacitor）完全独立：不修改、不依赖原有工作流。
# 同样覆盖五平台：Windows / Linux / macOS / Android / iOS。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android
          - ios
      publish:
        description: 'Upload assets to the GitHub Release of this tag (tag builds always publish)'
        required: false
        default: false
        type: boolean

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_MIRROR: https://npmmirror.com/mirrors/node/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  windows:
    name: Tauri · Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'win'
    env:
      CI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          CI: "false"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare Tauri CLI and icons
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @tauri-apps/cli@^2
          # iOS 的 Xcode 构建脚本通过 `npm run tauri ...` 调用 CLI，需要该 script
          npm pkg set scripts.tauri=tauri
          npm run tauri -- icon public/favicon/web-app-manifest-512x512.png

      # Tauri 打包时要从 github.com/tauri-apps/binary-releases 下载 NSIS 辅助二进制。
      # 官方开关 TAURI_BUNDLER_TOOLS_GITHUB_MIRROR：把 https://github.com 前缀换镜像。
      - name: Probe bundler tools mirror
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $probe = "/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip"
          $mirrors = @(
            "https://ghfast.top/https://github.com",
            "https://ghproxy.net/https://github.com",
            "https://gh-proxy.com/https://github.com"
          )
          foreach ($m in $mirrors) {
            try {
              $r = Invoke-WebRequest -Uri ($m + $probe) -Method Head -MaximumRedirection 5 -TimeoutSec 20 -SkipHttpErrorCheck
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 400) {
                "TAURI_BUNDLER_TOOLS_GITHUB_MIRROR=$m" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                Write-Host "using mirror: $m"
                break
              }
              Write-Host "mirror unusable ($($r.StatusCode)): $m"
            } catch {
              Write-Host "mirror error: $m"
            }
          }

      - name: Cache bundler tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-windows-nsis3-v1

      # 重试 3 次仍拿不到 NSIS 则降级为免安装 exe + zip。
      - name: Build Tauri (NSIS, portable fallback)
        shell: bash
        run: |
          set -uo pipefail
          OK=0
          for i in 1 2 3; do
            if npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis; then
              OK=1
              break
            fi
            echo "::warning::NSIS attempt $i failed (bundler download 504?), retrying..."
            sleep 20
          done
          if [ "$OK" != 1 ]; then
            echo "::warning::NSIS installer could not be bundled (504 on nsis-3.13.zip); falling back to portable build"
            npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle
          fi

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $V = (node -p "require('./package.json').version").Trim()
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter *.exe -File |
            Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
          if (-not $bin) { throw "Tauri executable not found" }
          Copy-Item $bin.FullName "dist/AoiRouxTrainers-tauri-$V-windows-x64.exe"
          Compress-Archive -Path "dist/AoiRouxTrainers-tauri-$V-windows-x64.exe" `
            -DestinationPath "dist/AoiRouxTrainers-tauri-$V-windows-x64-portable.zip" -Force
          $nsis = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsis) {
            $nsis | Copy-Item -Destination "dist/" -Force
          } else {
            Write-Host "::warning::no NSIS installer produced, shipping portable exe + zip only"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AoiRouxTrainers-tauri-win
          path: dist/*
          retention-days: 30

  linux:
    name: Tauri · Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    env:
      CI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 dpkg

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          CI: "false"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare Tauri CLI and icons
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @tauri-apps/cli@^2
          npm pkg set scripts.tauri=tauri
          npm run tauri -- icon public/favicon/web-app-manifest-512x512.png

      # 官方开关 TAURI_BUNDLER_TOOLS_GITHUB_MIRROR：把 github.com 前缀换成镜像，
      # 解决 AppImage 的 AppRun/linuxdeploy 从这里下载时 504 的问题。
      - name: Probe bundler tools mirror
        shell: bash
        run: |
          set -uo pipefail
          PROBE="/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip"
          for M in "https://ghfast.top/https://github.com" "https://ghproxy.net/https://github.com" "https://gh-proxy.com/https://github.com"; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 -I "$M$PROBE" || true)
            echo "mirror $M -> $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then
              echo "TAURI_BUNDLER_TOOLS_GITHUB_MIRROR=$M" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: Cache bundler tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-tools-linux-v1

      - name: Build Tauri (AppImage + deb)
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -uo pipefail
          OK=0
          for i in 1 2 3; do
            if npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles appimage,deb; then
              OK=1
              break
            fi
            echo "::warning::attempt $i failed (bundler download 504?), retrying..."
            sleep 20
          done
          if [ "$OK" != 1 ]; then
            echo "::warning::AppImage bundling failed (504 on AppRun); falling back to deb + portable binary"
            npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles deb
          fi

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          mkdir -p dist
          if ls src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage > /dev/null 2>&1; then
            cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage \
               "dist/AoiRouxTrainers-tauri-$V-linux-x64.AppImage"
          else
            echo "::warning::no AppImage produced, shipping deb + portable tar.gz only"
          fi
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb \
             "dist/AoiRouxTrainers-tauri-$V-linux-x64.deb" 2>/dev/null || true
          BIN="src-tauri/target/x86_64-unknown-linux-gnu/release/aoi-roux-trainers"
          [ -x "$BIN" ] || BIN="src-tauri/target/x86_64-unknown-linux-gnu/release/Aoi Roux Trainers"
          tar -czf "dist/AoiRouxTrainers-tauri-$V-linux-x64-portable.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AoiRouxTrainers-tauri-linux
          path: dist/*
          retention-days: 30

  macos:
    name: Tauri · macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac'
    env:
      CI: "false"
      # 无证书时用 ad-hoc 签名（"ad-hoc signing identity"），
      # 否则 Apple Silicon 机器上从 Release 下载的 dmg/app 会被系统判定为"已损坏"。
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          CI: "false"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare Tauri CLI and icons
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @tauri-apps/cli@^2
          npm pkg set scripts.tauri=tauri
          npm run tauri -- icon public/favicon/web-app-manifest-512x512.png

      - name: Build Tauri (dmg + app, ad-hoc signed)
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            if npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg; then
              exit 0
            fi
            echo "::warning::attempt $i failed, retrying..."
            sleep 20
          done
          exit 1

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          BASE=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p dist
          cp "$BASE"/dmg/*.dmg "dist/AoiRouxTrainers-tauri-$V-macos-arm64.dmg"
          APP=$(find "$BASE/macos" -maxdepth 1 -type d -name "*.app" 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            ditto -c -k --keepParent "$APP" "dist/AoiRouxTrainers-tauri-$V-macos-arm64.app.zip"
          else
            echo "::warning::no .app found in $BASE/macos, skipping app.zip"
          fi
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AoiRouxTrainers-tauri-mac
          path: dist/*
          retention-days: 30

  android:
    name: Tauri · Android arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    env:
      CI: "false"
      NDK_VERSION: '27.1.12297006'
      TAURI_ANDROID_KEYSTORE_B64: ${{ secrets.TAURI_ANDROID_KEYSTORE_B64 }}
      TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TAURI_ANDROID_KEYSTORE_PASSWORD }}
      TAURI_ANDROID_KEY_ALIAS: ${{ secrets.TAURI_ANDROID_KEY_ALIAS }}
      TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.TAURI_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 不用 android-actions/setup-android@v3：它内部会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除 tools 包，导致 "Failed to find package 'tools'" 直接红。
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK" || true

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          CI: "false"

      - name: Install Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare Tauri CLI, icons and Android project
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @tauri-apps/cli@^2
          npm pkg set scripts.tauri=tauri
          npm run tauri -- icon public/favicon/web-app-manifest-512x512.png
          npm run tauri -- android init --ci
          # Gradle wrapper 默认从 services.gradle.org 拉发行包，CI 里常 10s 超时；
          # 先用带重试的 curl 预下载（优先国内镜像），再把 distributionUrl 指到本地文件。
          GW=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$GW" ]; then
            VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-bin\.zip' "$GW" | head -1 | sed -E 's/^gradle-//; s/-bin\.zip$//')
            : "${VER:=9.6.1}"
            DIST="$RUNNER_TEMP/gradle-$VER-bin.zip"
            OK=0
            for URL in "https://mirrors.cloud.tencent.com/gradle/gradle-$VER-bin.zip" "https://services.gradle.org/distributions/gradle-$VER-bin.zip"; do
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 600 -o "$DIST" "$URL"; then OK=1; break; fi
            done
            [ "$OK" = 1 ] || { echo "ERROR: cannot download gradle $VER"; exit 1; }
            awk -v d="$DIST" '/^distributionUrl=/{print "distributionUrl=file\\://" d; next} {print}' "$GW" > "$GW.tmp" && mv "$GW.tmp" "$GW"
            grep -q '^networkTimeout=' "$GW" || echo 'networkTimeout=120000' >> "$GW"
            cat "$GW"
          fi
          # Maven Central 的包会被重定向到 github.com releases，CI 里经常 504；
          # 用阿里云镜像兜底，并放宽 Gradle HTTP 超时。
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'allprojects {' \
            '  buildscript { repositories { maven { url "https://maven.aliyun.com/repository/public" }; maven { url "https://maven.aliyun.com/repository/google" }; maven { url "https://maven.aliyun.com/repository/gradle-plugin" } } }' \
            '  repositories { maven { url "https://maven.aliyun.com/repository/google" }; maven { url "https://maven.aliyun.com/repository/public" } }' \
            '}' \
            'settingsEvaluated { settings ->' \
            '  settings.pluginManagement.repositories {' \
            '    maven { url "https://maven.aliyun.com/repository/gradle-plugin" }' \
            '    gradlePluginPortal()' \
            '  }' \
            '  settings.dependencyResolutionManagement.repositories {' \
            '    maven { url "https://maven.aliyun.com/repository/google" }' \
            '    maven { url "https://maven.aliyun.com/repository/public" }' \
            '  }' \
            '}' > "$HOME/.gradle/init.gradle"
          printf '%s\n' \
            'org.gradle.internal.http.connectionTimeout=120000' \
            'org.gradle.internal.http.socketTimeout=120000' >> "$HOME/.gradle/gradle.properties"
          cat "$HOME/.gradle/init.gradle"

      - name: Build APK (release, arm64)
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2; do
            if npm run tauri -- android build --apk --target aarch64; then
              exit 0
            fi
            echo "::warning::attempt $i failed, retrying..."
            sleep 15
          done
          exit 1

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "ERROR: no APK produced"; exit 1; }
          mkdir -p dist
          if [ -n "${TAURI_ANDROID_KEYSTORE_B64:-}" ]; then
            printf '%s' "$TAURI_ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            KS_PASS="${TAURI_ANDROID_KEYSTORE_PASSWORD}"
            KEY_PASS="${TAURI_ANDROID_KEY_PASSWORD:-$KS_PASS}"
            KEY_ALIAS="${TAURI_ANDROID_KEY_ALIAS}"
          else
            # 仓库内置的固定签名库：跨构建签名一致，可覆盖升级
            base64 -d src-tauri/mobile/android/aoi-roux-trainers.keystore.b64 > "$RUNNER_TEMP/app.keystore"
            KS_PASS="aoiroux2024"
            KEY_PASS="aoiroux2024"
            KEY_ALIAS="aoiroux"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "${BT}apksigner" sign --ks "$RUNNER_TEMP/app.keystore" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" \
            --out "dist/AoiRouxTrainers-tauri-$V-android-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "${BT}apksigner" verify --print-certs "dist/AoiRouxTrainers-tauri-$V-android-arm64.apk"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AoiRouxTrainers-tauri-android
          path: dist/*.apk
          retention-days: 30

  ios:
    name: Tauri · iOS arm64 (unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    env:
      CI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          CI: "false"

      - name: Install Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare Tauri CLI, icons and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @tauri-apps/cli@^2
          npm pkg set scripts.tauri=tauri
          npm run tauri -- icon public/favicon/web-app-manifest-512x512.png
          npm run tauri -- ios init --ci

      - name: Build iOS (device arm64, unsigned)
        run: npm run tauri -- ios build --target aarch64 --no-sign

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          mkdir -p dist
          IPA=$(find src-tauri/gen/apple -type f -name "*.ipa" | head -1 || true)
          if [ -n "${IPA:-}" ]; then
            cp "$IPA" "dist/AoiRouxTrainers-tauri-$V-ios-unsigned.ipa"
          else
            APP=$(find src-tauri/gen/apple -type d -name "*.app" | grep -v -i sim | head -1 || true)
            [ -n "${APP:-}" ] || APP=$(find src-tauri/gen/apple -type d -name "*.app" | head -1 || true)
            [ -n "${APP:-}" ] || { echo "ERROR: iOS .app bundle not found"; exit 1; }
            STAGE=$(mktemp -d)
            mkdir -p "$STAGE/Payload"
            cp -R "$APP" "$STAGE/Payload/"
            ( cd "$STAGE" && ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/dist/AoiRouxTrainers-tauri-$V-ios-unsigned.ipa" )
            rm -rf "$STAGE"
          fi
          SIM=$(find src-tauri/gen/apple -type d -name "*.app" | grep -i sim | head -1 || true)
          if [ -n "${SIM:-}" ]; then
            ( cd "$(dirname "$SIM")" && zip -qry "$GITHUB_WORKSPACE/dist/AoiRouxTrainers-tauri-$V-ios-simulator.app.zip" "$(basename "$SIM")" )
          fi
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AoiRouxTrainers-tauri-ios
          path: dist/*
          retention-days: 30

  publish:
    name: Upload Tauri assets to Release
    needs: [windows, linux, macos, android, ios]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: |
      always() && startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event.inputs.publish == 'true')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download all Tauri artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: AoiRouxTrainers-tauri-*

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            cp -r "$dir"* dist/ 2>/dev/null || true
          done
          ls -lh dist

      - name: Upload to release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$(ls -A dist)" ]; then
            echo "No Tauri artifacts produced, nothing to upload."
            exit 0
          fi
          # 等 build.yml 的 release job 建好 tag（最多 10 分钟），避免并发创建冲突
          for _ in $(seq 1 40); do
            if gh release view "$TAG" > /dev/null 2>&1; then break; fi
            sleep 15
          done
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
