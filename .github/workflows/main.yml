name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
          - os: macos-14
            target: mac
          - os: ubuntu-22.04
            target: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build
        env:
          CI: "false"

      - name: Init Capacitor
        if: matrix.target == 'android'
        run: |
          npx cap init AoiRouxTrainers com.aoirouxtrainers.app --web-dir=build || echo "already initialized"

      - name: Add Android platform
        if: matrix.target == 'android'
        run: |
          npx cap add android || echo "already added"

      - name: Verify Android SDK
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls /opt/android-sdk 2>/dev/null || echo "SDK not found at /opt/android-sdk"

      - name: Sync Capacitor
        if: matrix.target == 'android'
        run: npx cap sync android --verbose 2>&1 || (echo "=== cap sync failed, checking android dir ===" && ls android/ 2>/dev/null || echo "android dir not found" && exit 1)

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          cd android
          ANDROID_HOME=/opt/android-sdk ./gradlew assembleDebug

      - name: Build electron
        if: matrix.target != 'android'
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifact
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: release/
          retention-days: 7

      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find release -type f -exec cp -r {} dist/ \;

      - uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: \{\{ secrets.GITHUB_TOKEN \}\}
