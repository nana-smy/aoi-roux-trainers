name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
          - os: macos-14
            target: mac
          - os: ubuntu-22.04
            target: android

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build
        env:
          CI: "false"

      - name: Build electron
        if: matrix.target != 'android'
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Setup Android SDK
        if: matrix.target == 'android'
        run: |
          echo "Checking Android SDK..."
          if [ -d "/opt/android-sdk" ]; then
            echo "SDK found at /opt/android-sdk"
            ls /opt/android-sdk
          elif [ -d "$ANDROID_HOME" ]; then
            echo "SDK found at $ANDROID_HOME"
          else
            echo "Installing Android SDK from Google..."
            mkdir -p /opt/android-sdk/cmdline-tools
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools/
            mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest 2>/dev/null || true
            yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" --sdk_root=/opt/android-sdk
            echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload artifact
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: release/
          retention-days: 7

      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten
        run: |
          mkdir -p dist
          find release -type f -exec cp -r {} dist/ \;

      - uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
