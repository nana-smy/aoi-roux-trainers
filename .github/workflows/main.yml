name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
          - os: macos-14
            target: mac
          - os: ubuntu-22.04
            target: android

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build
        env:
          CI: "false"

      - name: Init Capacitor
        if: matrix.target == 'android'
        run: |
          npx cap init AoiRouxTrainers com.aoirouxtrainers.app --web-dir=build --skip-validation

      - name: Add Android platform
        if: matrix.target == 'android'
        run: |
          npx cap add android || echo "Android platform may already exist"

      - name: Verify Android SDK
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME 2>/dev/null || ls -la /opt/android-sdk 2>/dev/null || echo "SDK not found"

      - name: Sync Capacitor
        if: matrix.target == 'android'
        run: |
          npx cap sync android

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          cd android
          ./gradlew assembleDebug

      - name: Build electron
        if: matrix.target != 'android'
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifact
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: release/
          retention-days: 7

      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten
        run: |
          mkdir -p dist
          find release -type f -exec cp -r {} dist/ \;

      - uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
