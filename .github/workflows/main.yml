name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  NODE_OPTIONS: --max-old-space-size=4096 --openssl-legacy-provider

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
          - os: macos-14
            target: mac
          - os: ubuntu-22.04
            target: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build
        env:
          CI: "false"

      - name: Init Capacitor
        if: matrix.target == 'android'
        run: |
          echo "=== Checking if android/ already exists ==="
          if [ -d "android" ]; then
            echo "android/ already exists, skipping cap init/add"
          else
            echo "=== Running cap init ==="
            npx cap init AoiRouxTrainers com.aoirouxtrainers.app --web-dir=build --skip-validation
            echo "=== Running cap add android ==="
            npx cap add android --skip-validation
          fi
          echo "=== Verifying capacitor.config.ts ==="
          cat capacitor.config.ts || cat capacitor.config.json 2>/dev/null || echo "No config found"
          echo "=== Checking android/ directory ==="
          ls -la android/ 2>/dev/null || echo "android/ NOT FOUND"

      - name: Sync Capacitor
        if: matrix.target == 'android'
        run: |
          echo "=== Syncing Capacitor to Android ==="
          npx cap sync android 2>&1
          SYNC_EXIT=$?
          echo "cap sync exit code: $SYNC_EXIT"
          if [ $SYNC_EXIT -ne 0 ]; then
            echo "=== cap sync FAILED, checking state ==="
            ls -la android/app/src/main/assets/public/ 2>/dev/null || echo "public assets dir missing"
            cat android/capacitor.config.json 2>/dev/null || echo "no capacitor.config.json"
            exit $SYNC_EXIT
          fi

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls /opt/android-sdk 2>/dev/null || echo "SDK not at /opt/android-sdk"
          cd android
          ANDROID_HOME=/opt/android-sdk ./gradlew assembleDebug --stacktrace 2>&1

      - name: Build electron
        if: matrix.target != 'android'
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifact
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: release/
          retention-days: 7

      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find release -type f \( -name "*.zip" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.apk" \) -exec cp {} dist/ \;

      - uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
